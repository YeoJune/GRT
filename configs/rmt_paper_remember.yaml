# ARMT v2 Appendix C/E/I + original RMT curriculum wrapper.
# T4 pilot: first four curriculum levels, not the full 200-pair paper run.
model:
  name: rmt
  size: small
  rmt_backbone: gpt_neox
  vocab_size: 128
  segment_len: 4
  num_registers: 32
  d_model: 128
  tie_word_embeddings: false
  alu:
    num_layers: 4
    nhead: 4
    d_ff: 128
    dropout: 0.0
    activation: gelu
data:
  task: remember
  protocol: paper_ar
  key_size: 1
  value_size: 1
  vary_n_pairs: true
  train_segments: 2
  eval_segments: [6, 11, 16]  # Final stage: 5 trained / 10 and 15 unseen pair counts.
  train_samples: 1000000
  validation_samples: 512
  test_samples: 512
  data_seed: 20260916
training:
  model_seed: 1234
  batch_size: 512
  # CPU saved-storage B8 x64: ~2.65 GiB (1 pair), ~5.75 GiB (5 pairs).
  # CUDA/backward overhead is additional; actual training peak is logged.
  grad_accum_steps: 1
  max_steps: 1000
  max_seconds: 1200  # Overall curriculum wall budget; final test evaluation is additional.
  optimizer: adamw
  adam_beta2: 0.999
  lr: 0.0003
  weight_decay: 0.001
  scheduler: linear
  warmup_steps: 100
  grad_clip: 1.0
  grad_clip_type: value
  mixed_precision: fp32
  stop_on_convergence: true
  convergence_exact_match: 0.99
  curriculum:
    - {num_pairs: 1, key_size: 1, max_steps: 1000}
    - {num_pairs: 2, key_size: 1, max_steps: 500}
    - {num_pairs: 3, key_size: 1, max_steps: 500}
    - {num_pairs: 5, key_size: 1, max_steps: 1000}
evaluation:
  batch_size: 512
  every_steps: 100
  autoregressive_samples: 512
  warmup: 1
  iterations: 2
checkpoint:
  every_steps: 100
rtla:
  enabled: false
wandb:
  enabled: false
