# Native author RMT: backbone/wrapper/data/loss from commit 24cbb9.
# Reference update counts for the first two published curriculum levels;
# this is not a short T4 convergence promise. CPU checks use an explicit override.
model:
  name: rmt
  size: small
  rmt_backbone: author_neox
  vocab_size: 128
  segment_len: 4
  num_registers: 32
  d_model: 128
  tie_word_embeddings: false
  alu: {num_layers: 4, nhead: 4, d_ff: 128, dropout: 0.0, activation: gelu}
data:
  task: remember
  protocol: paper_ar
  data_seed: 54
  train_segments: 2
  eval_segments: [3]
  key_size: 1
  value_size: 1
  vary_n_pairs: true
  remember_sampling: random
  train_samples: 1000000
  validation_samples: 1000
  test_samples: 10000
training:
  model_seed: 54
  batch_size: 512
  grad_accum_steps: 1
  lr: 0.0003
  weight_decay: 0.001
  optimizer: adamw
  adam_beta2: 0.999
  scheduler: linear
  mixed_precision: fp32
  grad_clip: 1.0
  grad_clip_type: value
  stop_on_convergence: false
  max_seconds: null
  curriculum:
    - {num_pairs: 1, key_size: 1, max_steps: 2000}
    - {num_pairs: 2, key_size: 1, max_steps: 10000}
evaluation:
  batch_size: 512
  every_steps: 250
  autoregressive_samples: 1000
checkpoint:
  every_steps: 250
rtla: {enabled: false}
wandb: {enabled: false}
