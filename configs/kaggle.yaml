# Original effective batch512 on2 T4 GPUs. See dated experiment record.
training:
  batch_size: 256  # per GPU, not global
  grad_accum_steps: 1
  global_batch_size: 512
  stop_on_convergence: false
  max_seconds: 23400  # 6.5h includes setup inside trainer and validation
  curriculum:
    - {num_pairs: 1, key_size: 1, max_steps: 2000, batch_size: 256, grad_accum_steps: 1}
    - {num_pairs: 2, key_size: 1, max_steps: 10000, batch_size: 256, grad_accum_steps: 1}
    - {num_pairs: 3, key_size: 1, max_steps: 10000, batch_size: 256, grad_accum_steps: 1}
    - {num_pairs: 5, key_size: 1, max_steps: 10000, batch_size: 256, grad_accum_steps: 1}
    - {num_pairs: 10, key_size: 1, max_steps: 10000, batch_size: 256, grad_accum_steps: 1}
    - {num_pairs: 20, key_size: 2, max_steps: 10000, batch_size: 256, grad_accum_steps: 1}
    - {num_pairs: 40, key_size: 2, max_steps: 10000, batch_size: 128, grad_accum_steps: 2}
evaluation:
  batch_size: 256  # per GPU
  every_steps: 250
  pair_counts: [1, 2, 3, 5, 10, 20, 40, 50, 100, 200]
  generalization_samples: 1000
wandb: {enabled: true}
