# Short native-author pilot, not the full published update budget.
# Existing 2-pair B512 peak: 2.49 GiB -> B1024 approximately 4.98 GiB.
# Native throughput/VRAM is unmeasured: record it, retain ample T4 headroom.
# Effective batch 1024 (author: 512); LR/model/task/loss remain unchanged.
data:
  train_samples: 65536
  validation_samples: 512
  test_samples: 1024
training:
  batch_size: 1024
  grad_accum_steps: 1
  stop_on_convergence: true
  convergence_exact_match: 0.99
  max_seconds: null
  curriculum:
    - {num_pairs: 1, key_size: 1, max_steps: 600}
    - {num_pairs: 2, key_size: 1, max_steps: 2400}
evaluation:
  batch_size: 512
  every_steps: 100
  autoregressive_samples: 512
checkpoint:
  every_steps: 100
