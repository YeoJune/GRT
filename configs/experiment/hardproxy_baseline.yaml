# 하드 proxy: L1 대표성 확보용. L1의 어려운 구조(8세그먼트 + 사실4 + 노이즈0.6) 유지,
# segment_len 64→32로 줄여 seq 256(=8세그)로 속도↑. vocab 256. (toy_passkey가 사실4/노이즈0.6)
_base_: "toy_passkey.yaml"

model:
  vocab_size: 256
  segment_len: 32

data:
  seq_len: 256

training:
  batch_size: 8
  warmup_steps: 200

rtla:
  enabled: false

logging:
  save_dir: "checkpoints/hardproxy_baseline/"
  save_every_n_steps: 999999

wandb:
  run_name: "hardproxy-baseline"
  tags: ["improve2", "hardproxy", "baseline"]
  group: "improve2"
