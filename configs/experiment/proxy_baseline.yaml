# 빠른 개선 탐색용 proxy (baseline). seq 256(4세그), vocab 256, 사실 3. 크로스세그 메모리 유지하되 빠름.
_base_: "toy_passkey.yaml"

model:
  vocab_size: 256

data:
  seq_len: 256
  num_facts: 3
  num_queries: 3
  noise_token_fraction: 0.5

training:
  batch_size: 8
  warmup_steps: 100

rtla:
  enabled: false

logging:
  save_dir: "checkpoints/proxy_baseline/"
  save_every_n_steps: 999999

wandb:
  run_name: "proxy-baseline-bias-2.0"
  tags: ["improve", "proxy", "baseline"]
  group: "improve"
