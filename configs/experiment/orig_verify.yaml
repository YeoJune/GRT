# 원본 사이즈 재검증 (여준 요청 2026-06-15): vocab 50257 원본 passkey 과제를
# "위치 인코딩 버그 수정된 현재 모델"로 다시 돌려 loss가 떨어지는지(수렴) 확인.
# 과거 평지(loss 안 떨어짐)는 위치 인코딩 부재 시절. 지금은 그 근본원인을 고침 → 재검증 의미 있음.
_base_: "toy_passkey.yaml"

model:
  vocab_size: 50257   # 원본(최종 보스). chance loss = ln(50257) = 10.82

data:
  seq_len: 512
  num_facts: 4
  num_queries: 4
  noise_token_fraction: 0.6

training:
  batch_size: 8       # 6GB VRAM 안전 범위(원본은 1프로세스). OOM 나면 4 또는 2로.
  warmup_steps: 200
  max_steps: 20000    # loss 추이 확인엔 충분. 떨어지면 끝까지 갈지 판단.

rtla:
  enabled: false

logging:
  save_dir: "checkpoints/orig_verify/"
  save_every_n_steps: 2000
  eval_every_n_steps: 500

wandb:
  run_name: "orig-verify-vocab50257"
  tags: ["orig-verify", "vocab50257"]
  notes: "원본 사이즈 재검증 — 위치인코딩 수정 후 모델로 수렴 확인 (여준 요청)"
  group: "orig-verify"
