# Initial convergence pilot, shared by RMT and GRT; not the full 50k-step study.
# Apply after base.yaml, <model>.yaml and copy.yaml.
# Keep the standard model/task contract; actual T4 memory and speed must be measured.
model:
  size: small
  d_model: 256
  alu:
    num_layers: 4
    nhead: 4
    d_ff: 1024
    dropout: 0.1
data:
  data_seed: 20260916
  validation_samples: 256
  test_samples: 256
  num_workers: 0
training:
  model_seed: 1234
  batch_size: 4
  grad_accum_steps: 2
  max_steps: 5000
  lr: 0.0003
  weight_decay: 0.01
  warmup_steps: 200
  grad_clip: 1.0
  # Establish convergence in FP32 before a separately recorded FP16 experiment.
  # The current trainer stops on FP16 overflow rather than silently retrying.
  mixed_precision: fp32
evaluation:
  batch_size: 4
  every_steps: 250
  warmup: 3
  iterations: 10
checkpoint:
  every_steps: 500
rtla:
  enabled: true
  every_steps: 1000
  batch_size: 2
wandb:
  enabled: false
