# Common Remember experiment. Model selection belongs in rmt.yaml or grt.yaml.
model:
  vocab_size: 128
  segment_len: 4
  num_registers: 32
  d_model: 128
  alu: {num_layers: 4, nhead: 4, d_ff: 128, dropout: 0.0, activation: gelu}
data:
  name: remember
  data_seed: 54
  train_segments: 2
  key_size: 1
  value_size: 1
  vary_n_pairs: true
  train_samples: 1000000
  validation_samples: 1000
  test_samples: 10000
training:
  model_seed: 54
  batch_size: 512
  grad_accum_steps: 1
  lr: 0.0003
  weight_decay: 0.001
  adam_beta2: 0.999
  mixed_precision: fp32
  grad_clip: 1.0
  stop_on_convergence: false
  convergence_exact_match: 0.99
  max_seconds: null
  curriculum:
    - {num_pairs: 1, key_size: 1, max_steps: 2000}
    - {num_pairs: 2, key_size: 1, max_steps: 10000}
evaluation: {batch_size: 512, every_steps: 250}
rtla: {enabled: false, batch_size: 8}
wandb: {enabled: false, project: grt-research, every_steps: 50}
