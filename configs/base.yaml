model:
  size: small
  vocab_size: 1024
  segment_len: 128
  num_registers: 32
  d_model: 256
  tie_word_embeddings: true
  alu:
    num_layers: 4
    nhead: 4
    d_ff: 1024
    dropout: 0.1
    activation: gelu
data:
  data_seed: 20260916
  validation_samples: 1024
  test_samples: 4096
  num_workers: 0
training:
  model_seed: 1234
  batch_size: 32
  grad_accum_steps: 1
  max_steps: 50000
  lr: 0.0003
  weight_decay: 0.01
  warmup_steps: 1000
  grad_clip: 1.0
  mixed_precision: fp32
evaluation:
  batch_size: 32
  every_steps: 500
  warmup: 10
  iterations: 50
checkpoint:
  every_steps: 2000
rtla:
  enabled: true
  every_steps: 500
  batch_size: 32
wandb:
  enabled: false
  project: grt-research
  run_name: null
run:
  output_dir: null
