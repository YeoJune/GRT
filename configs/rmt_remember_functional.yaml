# Merge after rmt_paper_remember.yaml: controlled functional Remember test.
# Unique mappings across splits, every context queried at every fact position.
data:
  remember_sampling: balanced_contexts
  vary_n_pairs: false
  train_samples: 24576  # Stage 1 capped to 192; stage 2/3: 12288/8192 contexts.
  validation_samples: 1024
  test_samples: 1024
  eval_segments: [4, 6, 9]  # Train 3 pairs; evaluate 3/5/8 pairs.
training:
  batch_size: 1024
  grad_accum_steps: 1
  max_seconds: 2100
  warmup_steps: 150  # Each stage caps this at 10% of its update budget.
  curriculum:
    - {num_pairs: 1, key_size: 1, max_steps: 400}
    - {num_pairs: 2, key_size: 1, max_steps: 1500}
    - {num_pairs: 3, key_size: 1, max_steps: 1000}
evaluation:
  batch_size: 1024
  autoregressive_samples: 1024
