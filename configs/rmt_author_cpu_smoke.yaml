# Execution/resume smoke only; convergence is tested separately on a controlled fixture.
model:
  num_registers: 4
  d_model: 32
  alu: {num_layers: 2, nhead: 4, d_ff: 32}
data:
  train_samples: 16
  validation_samples: 4
  test_samples: 4
training:
  batch_size: 4
  curriculum:
    - {num_pairs: 1, key_size: 1, max_steps: 2}
    - {num_pairs: 2, key_size: 1, max_steps: 2}
evaluation:
  batch_size: 4
  every_steps: 1
  autoregressive_samples: 4
