# Stage 1: published short Copy architecture with a T4 throughput batch override.
# Standalone config; do not merge recovery/grt configs into this experiment.
model:
  name: rmt
  size: small
  rmt_backbone: relative_postln
  vocab_size: 12
  segment_len: 24
  num_registers: 24
  d_model: 128
  head_dim: 64
  alu:
    num_layers: 4
    nhead: 4
    d_ff: 256
    dropout: 0.1
    activation: relu
data:
  task: copy
  protocol: paper_copy
  target_len: 24
  train_segments: 3
  eval_segments: [3]
  train_samples: 100000
  validation_samples: 1024
  test_samples: 2048
  data_seed: 20260916
training:
  model_seed: 1234
  # CPU autograd saved-tensor estimate: ~4.8 GiB at B512, excluding CUDA/backward workspace.
  batch_size: 512
  grad_accum_steps: 1
  # T4 pilot: 2 min/125 updates -> ~32 min for 2K, not the published full sample budget.
  max_steps: 2000
  optimizer: adam
  adam_beta2: 0.999
  lr: 0.0001
  weight_decay: 0.0
  scheduler: plateau
  plateau_patience: 8
  plateau_every_steps: 750  # 750 x 512 = 12K x 32 sample presentations per LR decision.
  min_lr: 0.000001
  warmup_steps: 0
  grad_clip: 0.25
  mixed_precision: fp32
  stop_on_convergence: true
evaluation:
  batch_size: 512
  every_steps: 125
  autoregressive_samples: 64
  warmup: 2
  iterations: 5
checkpoint:
  every_steps: 125
rtla:
  enabled: false
wandb:
  enabled: false
