# Stage 1: NeurIPS 2022 short Copy (LM-RMT Figure 4, successful M=N=24 rows).
# Standalone config; do not merge recovery/grt configs into this experiment.
model:
  name: rmt
  size: small
  rmt_backbone: relative_postln
  vocab_size: 12
  segment_len: 24
  num_registers: 24
  d_model: 128
  head_dim: 64
  alu:
    num_layers: 4
    nhead: 4
    d_ff: 256
    dropout: 0.1
    activation: relu
data:
  task: copy
  protocol: paper_copy
  target_len: 24
  train_segments: 3
  eval_segments: [3]
  train_samples: 100000
  validation_samples: 1024
  test_samples: 2048
  data_seed: 20260916
training:
  model_seed: 1234
  batch_size: 32
  grad_accum_steps: 1
  max_steps: 400000  # Published budget ceiling, not an asserted convergence time.
  optimizer: adam
  adam_beta2: 0.999
  lr: 0.0001
  weight_decay: 0.0
  scheduler: plateau
  plateau_patience: 8
  plateau_every_steps: 12000  # Keep the published LR decision cadence despite more frequent logs.
  min_lr: 0.000001
  warmup_steps: 0
  grad_clip: 0.25
  mixed_precision: fp32
  stop_on_convergence: true
evaluation:
  batch_size: 32
  every_steps: 1000
  autoregressive_samples: 64
  warmup: 2
  iterations: 5
checkpoint:
  every_steps: 1000
rtla:
  enabled: false
wandb:
  enabled: false
