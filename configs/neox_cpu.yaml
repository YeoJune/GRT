model:
  d_model: 32
  num_registers: 4
  alu: {num_layers: 2, nhead: 4, d_ff: 64, dropout: 0.0}
  router: {pool_nhead: 4, mlp_hidden: 32}
training:
  batch_size: 4
  grad_accum_steps: 1
  global_batch_size: null
  max_steps: 4
  curriculum:
    - {num_pairs: 1, key_size: 1, max_steps: 4}
data: {train_samples: 16, validation_samples: 8, test_samples: 8}
evaluation: {batch_size: 4, every_steps: 2}
